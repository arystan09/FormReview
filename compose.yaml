services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-formreview}
      POSTGRES_USER: ${POSTGRES_USER:-formreview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build: .
    image: formreview:local
    environment: &app_environment
      FORMREVIEW_ENV: ${FORMREVIEW_ENV:-development}
      FORMREVIEW_PUBLIC_DEMO: ${FORMREVIEW_PUBLIC_DEMO:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-not-for-production}
      POSTGRES_DB: ${POSTGRES_DB:-formreview}
      POSTGRES_USER: ${POSTGRES_USER:-formreview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      FORMREVIEW_PRIVATE_ROOT: /app/private
    volumes:
      - private_sources:/app/private
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  worker:
    image: formreview:local
    command: ["python", "manage.py", "process_jobs"]
    environment:
      <<: *app_environment
      FORMREVIEW_OPENAI_API_KEY: ${FORMREVIEW_OPENAI_API_KEY:-}
    volumes:
      - private_sources:/app/private
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      disable: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
volumes:
  private_sources:
  postgres_data:
