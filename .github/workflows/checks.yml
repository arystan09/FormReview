name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: formreview
          POSTGRES_USER: formreview
          POSTGRES_PASSWORD: local-development-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U formreview -d formreview"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv run python manage.py check
      - run: uv run python manage.py help
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy formreview accounts documents extraction reviews evaluation
      - run: uv run pytest --collect-only
      - run: uv run pytest -m "not integration and not e2e"
      - run: uv run python manage.py migrate
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest -m integration
      - run: uv run python manage.py process_jobs --help
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m e2e
      - run: uv run python scripts/demo_smoke.py
      - run: uv run python manage.py configure_live --help
      - run: uv run python manage.py evaluate --help
      - run: uv run python manage.py evaluate --dataset datasets/test/manifest.json --validate-only
      - run: uv run python manage.py evaluate --dataset datasets/dev/manifest.json --provider baseline --output work/ci-baseline.json
      - run: uv run python manage.py evaluate --dataset datasets/dev/manifest.json --provider replay --output work/ci-replay.json
      - run: docker compose config --quiet
      - run: docker build -t formreview:local .
      - run: uv run python scripts/check_container.py
