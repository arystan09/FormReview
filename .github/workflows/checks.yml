name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv run python manage.py check
      - run: uv run python manage.py help
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy formreview
      - run: uv run pytest --collect-only
      - run: uv run pytest -m "not integration and not e2e"
      - run: docker compose config --quiet
      - run: docker build -t formreview:local .
      - run: uv run python scripts/check_container.py
